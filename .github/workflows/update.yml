name: Atualizar conteúdo
on:
  schedule:
    - cron: "17 */3 * * *"   # YouTube + blog a cada 3h
    - cron: "41 6 * * 1"     # screenshots dos produtos toda segunda
  workflow_dispatch:
    inputs:
      screenshots: { description: "Recapturar screenshots dos produtos", type: boolean, default: false }
  repository_dispatch:
    types: [blog-updated]
permissions:
  contents: write
concurrency: { group: update-content, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Atualizar dados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOTS: ${{ github.event.schedule == '41 6 * * 1' || inputs.screenshots == true }}
        run: |
          if [ "$SHOTS" = "true" ]; then python scripts/update_data.py --screenshots; else python scripts/update_data.py; fi
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          git diff --cached --quiet && echo "sem mudanças" && exit 0
          git commit -m "chore: atualiza conteúdo automático [skip ci]"
          git push
